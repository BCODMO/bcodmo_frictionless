[tool:pytest]
# The filters below silence warnings emitted from third-party dependencies
# (tabulator, tableschema, datapackage, dateutil, jsonschema,
# importlib-resources, billiard) that cannot be fixed without patching those
# packages. Warnings originating in bcodmo_frictionless itself are deliberately
# left unfiltered so real issues stay visible -- our own loader-option, logging,
# and temp-file-leak warnings were fixed in the source rather than suppressed.
filterwarnings =
    ignore:Subclassing validator classes is not intended:DeprecationWarning
    ignore:path is deprecated. Use files:DeprecationWarning
    ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning
    ignore:datetime.datetime.utcnow:DeprecationWarning
    ignore:This process \(pid=\d+\) is multi-threaded:DeprecationWarning
    ignore::ResourceWarning
